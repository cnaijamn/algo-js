<!DOCTYPE html>
<html>
<body>

<canvas id="canvas" width="30" height="900"></canvas></canvas>

<script type="module">
import blackbody from "../../etc/blackbody.mjs";

const W = 30, H = 900;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const imageData = ctx.createImageData(W, H)
const data = imageData.data;

for (let y = 0, T = 1000.0; y < 10000.0; y++, T += 10.0) {
  const rgb = blackbody(T);
  console.log(rgb);
  for (let x = 0; x < W; x++) {
    const idx = (y * W + x) * 4;
    data[idx + 0] = rgb[0];
    data[idx + 1] = rgb[1];
    data[idx + 2] = rgb[2];
    data[idx + 3] = 255;
  }
}
ctx.putImageData(imageData, 0, 0);
</script>

</body>
</html>
